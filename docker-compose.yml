services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexus_ai_trader
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_ai_trader"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/topalogluonur53/tradeo-backend:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PROJECT_NAME: NEXUS AI TRADER
      ENVIRONMENT: development
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://nexus:nexus_password@postgres:5432/nexus_ai_trader
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://192.168.1.164:3000
      TRADING_MODE: paper
      KILL_SWITCH_ENABLED: "false"
      MARKET_DATA_BASE_URL: https://data-api.binance.vision
      MARKET_DATA_TIMEOUT_SECONDS: "10"
      PAPER_INITIAL_EQUITY: "10000"
      PAPER_TRADE_INTERVAL_SECONDS: "30"
      PAPER_DEFAULT_SYMBOL: BTCUSDT
      PAPER_DEFAULT_INTERVAL: 1h
      RISK_PER_TRADE: "0.005"
      MAX_SINGLE_POSITION_PCT: "0.10"
      MAX_TOTAL_EXPOSURE_PCT: "0.30"
      MAX_OPEN_POSITIONS: "3"
      DAILY_LOSS_LIMIT_PCT: "0.02"
      MAX_DRAWDOWN_LIMIT_PCT: "0.08"
      MIN_RISK_REWARD: "1.5"
      COOLDOWN_AFTER_LOSSES: "3"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    image: ghcr.io/topalogluonur53/tradeo-backend:latest
    restart: unless-stopped
    environment:
      PROJECT_NAME: NEXUS AI TRADER
      ENVIRONMENT: development
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://nexus:nexus_password@postgres:5432/nexus_ai_trader
      REDIS_URL: redis://redis:6379/0
      TRADING_MODE: paper
      KILL_SWITCH_ENABLED: "false"
      MARKET_DATA_BASE_URL: https://data-api.binance.vision
      MARKET_DATA_TIMEOUT_SECONDS: "10"
      PAPER_INITIAL_EQUITY: "10000"
      PAPER_TRADE_INTERVAL_SECONDS: "30"
      PAPER_DEFAULT_SYMBOL: BTCUSDT
      PAPER_DEFAULT_INTERVAL: 1h
      RISK_PER_TRADE: "0.005"
      MAX_SINGLE_POSITION_PCT: "0.10"
      MAX_TOTAL_EXPOSURE_PCT: "0.30"
      MAX_OPEN_POSITIONS: "3"
      DAILY_LOSS_LIMIT_PCT: "0.02"
      MAX_DRAWDOWN_LIMIT_PCT: "0.08"
      MIN_RISK_REWARD: "1.5"
      COOLDOWN_AFTER_LOSSES: "3"
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]

  frontend:
    image: ghcr.io/topalogluonur53/tradeo-frontend:latest
    restart: unless-stopped
    environment:
      API_URL: http://backend:8000/api
      NEXT_PUBLIC_API_BASE_URL: http://192.168.1.164:8000/api
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
